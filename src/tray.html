<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PILLVYN — Quick Menu</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/tray.css" />
  </head>
  <body data-theme="obsidian">
    <div id="tray-root" class="tray-frame">
      <div class="tray-card" role="menu" aria-label="PILLVYN Quick Menu">
        <header class="tray-header">
          <div class="tray-brand">
            <img src="assets/icon.png" alt="PILLVYN" class="tray-logo" />
            <div class="tray-brand-copy">
              <div class="tray-title-row">
                <span class="tray-title">PILLVYN</span>
                <span id="tray-version" class="tray-version">v1.3.0</span>
              </div>
              <div id="tray-status-line" class="tray-subtitle">Ready</div>
            </div>
          </div>
          <span id="tray-live-dot" class="tray-status-dot is-online" title="Island Active"></span>
        </header>

        <div id="tray-now-playing" class="tray-now-playing is-hidden" aria-live="polite">
          <span class="tray-eq" aria-hidden="true"><span></span><span></span><span></span></span>
          <span id="tray-media-text" class="tray-media-text">No active media</span>
        </div>

        <nav class="tray-section" aria-label="Island Controls">
          <button
            type="button"
            class="tray-item"
            data-action="toggle_visibility"
            role="menuitemcheckbox"
            aria-checked="true"
          >
            <span class="tray-item-left">
              <span class="tray-icon" data-icon="eye"></span>
              <span id="tray-vis-label" class="tray-label">Island Visible</span>
            </span>
            <span id="tray-vis-switch" class="tray-switch is-on" aria-hidden="true"></span>
          </button>

          <button
            type="button"
            class="tray-item"
            data-action="toggle_expand"
            role="menuitem"
          >
            <span class="tray-item-left">
              <span class="tray-icon" data-icon="expand"></span>
              <span id="tray-expand-label" class="tray-label">Expand Island</span>
            </span>
            <span id="tray-expand-pill" class="tray-pill">Compact</span>
          </button>
        </nav>

        <div class="tray-divider" role="separator"></div>

        <nav class="tray-section" aria-label="Focus Modes">
          <button
            type="button"
            class="tray-item"
            data-action="toggle_dnd"
            role="menuitemcheckbox"
            aria-checked="false"
          >
            <span class="tray-item-left">
              <span class="tray-icon" data-icon="bellOff"></span>
              <span class="tray-label">Do Not Disturb</span>
            </span>
            <span id="tray-dnd-switch" class="tray-switch" aria-hidden="true"></span>
          </button>

          <button
            type="button"
            class="tray-item"
            data-action="toggle_focus"
            role="menuitemcheckbox"
            aria-checked="false"
          >
            <span class="tray-item-left">
              <span class="tray-icon" data-icon="moon"></span>
              <span class="tray-label">Focus Mode</span>
            </span>
            <span id="tray-focus-switch" class="tray-switch" aria-hidden="true"></span>
          </button>
        </nav>

        <div class="tray-divider" role="separator"></div>

        <nav class="tray-section" aria-label="Application">
          <button
            type="button"
            class="tray-item"
            data-action="open_settings"
            role="menuitem"
          >
            <span class="tray-item-left">
              <span class="tray-icon" data-icon="sliders"></span>
              <span class="tray-label">Settings Studio</span>
            </span>
            <span class="tray-chevron" aria-hidden="true">›</span>
          </button>

          <button
            type="button"
            class="tray-item is-danger"
            data-action="quit"
            role="menuitem"
          >
            <span class="tray-item-left">
              <span class="tray-icon" data-icon="power"></span>
              <span class="tray-label">Quit PILLVYN</span>
            </span>
          </button>
        </nav>
      </div>
    </div>

    <script type="module" src="js/tray.js"></script>
  </body>
</html>
