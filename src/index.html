<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PILLVYN</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/island.css" />
    <link rel="stylesheet" href="styles/modules.css" />
  </head>
  <body>
    <main class="island-stage">
      <section
        id="island-shell"
        class="island-shell"
        data-state="compact"
        data-theme="obsidian"
        aria-label="PILLVYN Dynamic Island"
      >
        <!-- Minimized Capsule -->
        <div id="view-minimized" class="view-minimized" title="Click to restore PILLVYN">
          <span id="mini-dot" class="mini-dot"></span>
          <span id="mini-time" class="mini-time">--:--</span>
          <span id="mini-label" class="mini-label">IDLE</span>
        </div>

        <!-- Compact Capsule -->
        <div id="view-compact" class="view-compact" title="Click to expand PILLVYN · Right-click to minimize">
          <div class="compact-left">
            <div id="compact-artwork" class="compact-artwork">
              <span id="compact-artwork-icon"></span>
            </div>
            <div class="compact-meta">
              <div id="compact-title" class="compact-title">PILLVYN</div>
              <div id="compact-sub" class="compact-sub">Windows Dynamic Hub</div>
            </div>
          </div>
          <div class="compact-right">
            <div id="compact-eq" class="eq-bars" aria-hidden="true">
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
            </div>
            <span id="compact-chip" class="compact-chip">--:--</span>
          </div>
        </div>

        <!-- Expanded Dynamic Island Hub -->
        <div id="view-expanded" class="view-expanded">
          <header class="expanded-header">
            <div class="brand-pill">
              <span class="brand-orb"></span>
              <span class="brand-name">PILLVYN</span>
              <span id="header-clock" class="header-clock">--:--</span>
            </div>
            <div class="header-controls">
              <button id="btn-dnd" class="icon-btn" title="Do Not Disturb"></button>
              <button id="btn-focus" class="icon-btn" title="Focus Mode"></button>
              <button id="btn-minimize" class="icon-btn" title="Minimize Capsule"></button>
              <button id="btn-collapse" class="icon-btn" title="Collapse to Compact"></button>
              <button id="btn-settings" class="icon-btn" title="Open Settings Studio"></button>
            </div>
          </header>

          <div id="activities-strip" class="activities-strip" aria-label="Live Activities"></div>

          <nav id="module-nav" class="module-nav" role="tablist" aria-label="PILLVYN Modules"></nav>

          <section id="module-panel" class="module-panel" role="tabpanel"></section>
        </div>
      </section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
