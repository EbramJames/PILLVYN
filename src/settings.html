<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PILLVYN — Settings Studio</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/settings.css" />
  </head>
  <body data-theme="obsidian">
    <div class="settings-shell">
      <aside class="settings-sidebar">
        <div class="brand-lockup">
          <img src="assets/icon.png" alt="PILLVYN Logo" class="brand-emblem" />
          <div class="brand-copy">
            <span class="brand-name">PILLVYN</span>
            <span id="studio-version" class="brand-sub">Studio · v1.5.0</span>
          </div>
        </div>

        <nav id="settings-nav" class="settings-nav" aria-label="Settings Categories"></nav>

        <div class="sidebar-status" id="sidebar-status">
          <div class="sidebar-status-row">
            <span id="sidebar-status-dot" class="status-dot is-online"></span>
            <span id="sidebar-status-text" class="sidebar-status-title">Island Active</span>
          </div>
          <div id="sidebar-status-meta" class="sidebar-status-meta">1 display ready</div>
          <div class="sidebar-quick-btns">
            <button id="btn-toggle-island" type="button" class="btn-mini">Hide / Show</button>
            <button id="btn-expand-island" type="button" class="btn-mini">Expand</button>
          </div>
        </div>
      </aside>

      <main class="settings-main">
        <header class="settings-topbar">
          <div class="topbar-copy">
            <h1 id="section-title">Appearance</h1>
            <p id="section-subtitle">Choose your glass theme, accent color, and live capsule sizing.</p>
          </div>
          <div class="topbar-actions">
            <span id="dirty-pill" class="dirty-pill is-saved">All Saved</span>
            <button id="btn-revert" type="button" class="btn-secondary" disabled>Revert</button>
            <button id="btn-reset" type="button" class="btn-secondary">Reset Defaults</button>
            <button id="btn-save" type="button" class="btn-primary">Save Changes</button>
          </div>
        </header>

        <div id="settings-banner" class="settings-banner is-hidden" role="status" aria-live="polite"></div>

        <div id="settings-content" class="settings-content"></div>
      </main>
    </div>

    <script type="module" src="js/settings.js"></script>
  </body>
</html>
