name: build

# Every push builds, lints, and tests PILLVYN on Windows. A tag like v3.1.0 also publishes a GitHub Release:
# NSIS installer, versioned x64 setup, portable exe, zip, SHA-256 checksums, and latest.json (for the in-app updater).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check UI JavaScript syntax
        run: |
          node --check ui/bridge.js
          node --check ui/app.js

      - name: Check Rust formatting, lints, and unit tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

      - name: Build & Package
        shell: pwsh
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress }
          & .\scripts\package.ps1
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Verify packaged installer checksum via Rust test
        working-directory: src-tauri
        run: cargo test --locked verifies_sha256_checksum_file

      - uses: actions/upload-artifact@v4
        with:
          name: PILLVYN-Windows-${{ env.VERSION }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PILLVYN ${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*
